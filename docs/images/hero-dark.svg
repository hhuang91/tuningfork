  <text x="776" y="241" class="rate-ok" text-anchor="start">20 / 20</text>
  <text x="844" y="241" class="ci" text-anchor="start">[84–100%]</text>
  <text x="342" y="296" class="pvalue" text-anchor="start">Fisher’s exact p = 1.5 × 10⁻¹¹<tspan class="note" dx="12">·  the target, named before the first sample: the keys the check wants</tspan></text>
