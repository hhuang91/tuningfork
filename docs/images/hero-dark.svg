<svg xmlns="http://www.w3.org/2000/svg" width="960" height="486" viewBox="0 0 960 486" role="img" aria-labelledby="title desc">
  <title id="title">tuningfork, in one picture</title>
  <desc id="desc">Ten runs of a skill pass 4 times in 10 [17-69%]: every run that searched for the file with search_files passed, every run that gave up when its read found nothing failed. That step, sent again 20 times with its history held fixed: it gives up 16 times and searches 4. Its reasoning forks after 'it was not found': 'According' (80%) goes on to 'I should say so and stop', 'Wait' (7%) to 'search for it first?'. One line in the skill: find the file with search_files, then read it. At that step the model then searched 20 times in 20 (Fisher p = 1.5e-7), and 10 full runs pass 10 times in 10 [72-100%], Fisher p = 0.011 against 4 in 10.</desc>
