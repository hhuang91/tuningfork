<svg xmlns="http://www.w3.org/2000/svg" width="960" height="456" viewBox="0 0 960 456" role="img" aria-labelledby="title desc">
  <title id="title">tuningfork, in one picture</title>
  <desc id="desc">A recorded run fails at its write step, where the model names the report's keys count and total; the check wants row_count. That step, sent to the model twenty times with everything before it held fixed: as written, 0 of 20 name the keys the check wants [0-16%]; with an edit that names them, 20 of 20 [84-100%], Fisher's exact p = 1.5e-11. Full runs with the edit: 8 of 8 pass [68-100%], against 0 of 8 [0-32%] before.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .num { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #a5a59c; }
    .lane { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 650; fill: #e9e9e4; }
    .lane-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #a5a59c; }
    .step { fill: #1c1c1a; stroke: #45453f; stroke-width: 1.2; }
    .step-hot { fill: #262a4d; stroke: #8b95ff; stroke-width: 2; }
    .step-k { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #a5a59c; letter-spacing: .02em; }
    .step-t { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13.5px; fill: #e9e9e4; }
    .wrong { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 12.5px; fill: #f07b72; }
    .arrow { stroke: #75756d; stroke-width: 1.4; fill: none; }
    .arrowhead { fill: #75756d; }
    .rail { stroke: #8b95ff; stroke-width: 1.6; fill: none; stroke-dasharray: 4 4; }
    .railhead { fill: #8b95ff; }
    .verdict-bad { fill: #3d1f1d; stroke: #f07b72; stroke-width: 1.2; }
    .verdict-ok { fill: #1b3122; stroke: #62c27b; stroke-width: 1.2; }
    .t-bad { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #f07b72; }
    .t-ok { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #62c27b; }
    .dot-bad { fill: #3d1f1d; stroke: #f07b72; stroke-width: 1.3; }
    .dot-ok { fill: #62c27b; }
    .arm { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #e9e9e4; }
    .rate-bad { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #f07b72; }
    .rate-ok { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #62c27b; }
    .ci { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; fill: #a5a59c; }
    .note { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #a5a59c; }
    .pvalue { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #e9e9e4; }
    .rule { stroke: #2f2f2b; stroke-width: 1; }
    .frame { fill: #141412; stroke: #2f2f2b; stroke-width: 1; }
    </style>
  <rect x="0.5" y="0.5" width="959" height="455" rx="14" class="frame"/>
  <text x="24" y="52" class="num" text-anchor="start">1</text><text x="46" y="52" class="lane" text-anchor="start">A recorded run</text><text x="46" y="71" class="lane-sub" text-anchor="start">every call, its exact context</text>
  <rect x="210" y="26" width="156" height="62" rx="9" class="step"/>
  <text x="224" y="48" class="step-k" text-anchor="start">STEP 0</text>
  <text x="224" y="70" class="step-t" text-anchor="start">read data.csv</text>
  <line x1="372" y1="57.0" x2="393" y2="57.0" class="arrow"/><path d="M 400 57.0 L 392 52.5 L 392 61.5 z" class="arrowhead"/>
