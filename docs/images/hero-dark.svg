  <text x="855" y="110" class="note" text-anchor="middle">wants row_count</text>
  <path d="M 511.0 122 L 511.0 174" class="rail"/>
  <path d="M 511.0 183 L 506.0 174 L 516.0 174 z" class="railhead"/>
  <text x="24" y="206" class="num" text-anchor="start">2</text><text x="46" y="206" class="lane" text-anchor="start">That step, sent again ×20</text><text x="46" y="225" class="lane-sub" text-anchor="start">everything before it held fixed</text>
  <text x="322" y="201" class="arm" text-anchor="end">as written</text>
