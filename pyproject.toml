[project]
name = "tuningfork-lab"
dynamic = ["version", "readme"]
description = "A step debugger and experiment lab for agent skills on local LLMs"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Heyuan Huang" }]
keywords = ["agents", "agent skills", "llm", "debugger", "evaluation", "llama.cpp", "mcp"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "starlette>=0.41",
    "uvicorn>=0.32",
    "httpx>=0.28",
    "rich>=13.7",
    "typer>=0.15",
]

[project.urls]
Homepage = "https://github.com/hhuang91/tuningfork"
Issues = "https://github.com/hhuang91/tuningfork/issues"
Changelog = "https://github.com/hhuang91/tuningfork/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# `tuningfork mcp`: the operations as tools for an agent. Imported only there.
mcp = ["mcp>=2.2,<3"]

[project.scripts]
tuningfork = "tuningfork.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "anyio>=4.6",
    # The extra, so `uv sync --all-groups` installs what the MCP tests need.
    "mcp>=2.2,<3",
    # The design-md example's check reads YAML; its tests skip without it.
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/tuningfork/__init__.py"

# PyPI shows README.md with its links to the repository's files made absolute: it reads a
# relative one against its own page. A link to a heading works there as it is. It draws no
# Mermaid, so a diagram is a link to the README on GitHub.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(\]\(|src="|srcset=")(docs/images/)'
replacement = '\1https://raw.githubusercontent.com/hhuang91/tuningfork/main/\2'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)\s]+)\)'
replacement = '](https://github.com/hhuang91/tuningfork/blob/main/\1)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(?s)```mermaid\r?\n.*?\r?\n```'
replacement = '[See the diagram on GitHub.](https://github.com/hhuang91/tuningfork#how-it-works)'

[tool.hatch.build.targets.wheel]
packages = ["src/tuningfork"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error"]
markers = [
    "real_server: needs a real llama.cpp server named by TUNINGFORK_REAL_SERVER; skipped otherwise",
]
